<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MémoGuide – Suivi de Lucien</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <style>
        :root {
          --bg:        #f5f0e8;
          --surface:   #fffdf8;
          --border:    #e2d9c8;
          --text:      #1a1510;
          --muted:     #7a6e5f;
          --vert:      #2d7a4f;
          --vert-light:#e8f5ee;
          --orange:    #c45c1a;
          --orange-light:#fdf0e6;
          --rouge:     #b52a2a;
          --rouge-light:#fdeaea;
          --accent:    #3d5a80;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          font-family: 'DM Sans', sans-serif;
          background: var(--bg);
          color: var(--text);
          min-height: 100vh;
          padding: 0 0 60px;
        }

        /* ── En-tête ── */
        header {
          background: var(--surface);
          border-bottom: 1px solid var(--border);
          padding: 28px 40px 24px;
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          flex-wrap: wrap;
          gap: 12px;
        }

        .header-title {
          font-family: 'DM Serif Display', serif;
          font-size: 2rem;
          color: var(--text);
          line-height: 1.1;
        }

        .header-title span {
          font-style: italic;
          color: var(--accent);
        }

        .header-sub {
          font-size: 0.85rem;
          color: var(--muted);
          margin-top: 4px;
        }

        .refresh-info {
          font-size: 0.78rem;
          color: var(--muted);
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 20px;
          padding: 6px 14px;
          white-space: nowrap;
        }

        .refresh-dot {
          display: inline-block;
          width: 7px; height: 7px;
          border-radius: 50%;
          background: var(--vert);
          margin-right: 6px;
          animation: pulse 2s infinite;
        }

        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50%       { opacity: 0.3; }
        }

        /* ── Layout ── */
        main {
          max-width: 900px;
          margin: 0 auto;
          padding: 36px 24px 0;
          display: flex;
          flex-direction: column;
          gap: 28px;
        }

        /* ── Carte générique ── */
        .card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 28px 30px;
        }

        .card-title {
          font-family: 'DM Serif Display', serif;
          font-size: 1.15rem;
          margin-bottom: 20px;
          color: var(--text);
          display: flex;
          align-items: center;
          gap: 10px;
        }

        /* ── Résumé du jour ── */
        .resume-grid {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
          gap: 14px;
          margin-bottom: 24px;
        }

        .resume-stat {
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 16px 18px;
          text-align: center;
        }

        .resume-stat .val {
          font-family: 'DM Serif Display', serif;
          font-size: 2.4rem;
          line-height: 1;
          color: var(--accent);
        }

        .resume-stat .lbl {
          font-size: 0.78rem;
          color: var(--muted);
          margin-top: 4px;
        }

        /* Barre de progression */
        .progress-wrap {
          background: var(--border);
          border-radius: 999px;
          height: 10px;
          overflow: hidden;
        }

        .progress-bar {
          height: 100%;
          border-radius: 999px;
          background: linear-gradient(90deg, var(--vert), #4caf78);
          transition: width 0.6s ease;
        }

        .progress-label {
          font-size: 0.82rem;
          color: var(--muted);
          margin-top: 8px;
          text-align: right;
        }

        /* ── Liste des tâches du jour ── */
        .tache-item {
          display: flex;
          align-items: center;
          gap: 14px;
          padding: 14px 0;
          border-bottom: 1px solid var(--border);
        }

        .tache-item:last-child { border-bottom: none; }

        .tache-badge {
          flex-shrink: 0;
          width: 34px; height: 34px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 1rem;
        }

        .badge-ok   { background: var(--vert-light);   color: var(--vert); }
        .badge-todo { background: var(--bg);            color: var(--muted); border: 1px solid var(--border); }

        .tache-info { flex: 1; }

        .tache-nom {
          font-size: 0.95rem;
          font-weight: 500;
          color: var(--text);
        }

        .tache-plage {
          font-size: 0.78rem;
          color: var(--muted);
          margin-top: 2px;
        }

        .tache-statut {
          font-size: 0.75rem;
          font-weight: 600;
          padding: 3px 10px;
          border-radius: 20px;
        }

        .statut-ok     { background: var(--vert-light);   color: var(--vert); }
        .statut-todo   { background: var(--bg);            color: var(--muted); border: 1px solid var(--border); }
        .statut-retard { background: var(--orange-light);  color: var(--orange); }

        /* ── Historique 7 jours ── */
        .histo-grid {
          display: grid;
          grid-template-columns: repeat(7, 1fr);
          gap: 8px;
        }

        .histo-jour {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
        }

        .histo-bar-wrap {
          width: 100%;
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 8px;
          height: 80px;
          display: flex;
          align-items: flex-end;
          overflow: hidden;
        }

        .histo-bar {
          width: 100%;
          border-radius: 6px 6px 0 0;
          background: linear-gradient(180deg, #4caf78, var(--vert));
          transition: height 0.5s ease;
        }

        .histo-date {
          font-size: 0.7rem;
          color: var(--muted);
          text-align: center;
        }

        .histo-count {
          font-size: 0.75rem;
          font-weight: 600;
          color: var(--text);
        }

        .histo-retard {
          font-size: 0.65rem;
          color: var(--orange);
        }

        .histo-jour.today .histo-date { color: var(--accent); font-weight: 600; }
        .histo-jour.today .histo-bar  { background: linear-gradient(180deg, #6b9fd4, var(--accent)); }

        /* ── Événements du jour ── */
        .evt-list {
          display: flex;
          flex-direction: column;
          gap: 10px;
        }

        .evt-item {
          display: flex;
          align-items: center;
          gap: 12px;
          background: var(--bg);
          border: 1px solid var(--border);
          border-radius: 10px;
          padding: 10px 14px;
          font-size: 0.85rem;
        }

        .evt-heure { color: var(--muted); font-size: 0.78rem; min-width: 80px; }
        .evt-nom   { flex: 1; font-weight: 500; }

        .evt-ok    { border-left: 3px solid var(--vert); }
        .evt-tard  { border-left: 3px solid var(--orange); }

        .evt-tag {
          font-size: 0.68rem;
          padding: 2px 8px;
          border-radius: 12px;
          font-weight: 600;
        }

        .tag-ok   { background: var(--vert-light);  color: var(--vert); }
        .tag-tard { background: var(--orange-light); color: var(--orange); }

        /* ── Erreur / chargement ── */
        .empty-state {
          text-align: center;
          color: var(--muted);
          font-size: 0.9rem;
          padding: 24px 0;
        }

        /* ── Responsive ── */
        @media (max-width: 600px) {
          header { padding: 20px; }
          main   { padding: 20px 14px 0; }
          .card  { padding: 20px 16px; }
          .resume-stat .val { font-size: 1.8rem; }
          .histo-grid { grid-template-columns: repeat(7, 1fr); gap: 4px; }
          .histo-bar-wrap { height: 60px; }
        }
    </style>
</head>
<body>

<header>
    <div>
        <div class="header-title">Suivi de <span>Lucien</span></div>
        <div class="header-sub">Tableau de bord famille · Mis à jour automatiquement</div>
    </div>
    <div class="refresh-info">
        <span class="refresh-dot"></span>
        Actualisation toutes les 10 s
    </div>
</header>

<main>

    <!-- Résumé du jour -->
    <div class="card" id="card-resume">
        <div class="card-title">📅 Aujourd'hui — <span id="date-label">…</span></div>

        <div class="resume-grid">
            <div class="resume-stat">
                <div class="val" id="stat-validees">–</div>
                <div class="lbl">tâches faites</div>
            </div>
            <div class="resume-stat">
                <div class="val" id="stat-total">–</div>
                <div class="lbl">tâches au total</div>
            </div>
            <div class="resume-stat">
                <div class="val" id="stat-pct">–</div>
                <div class="lbl">% de réussite</div>
            </div>
        </div>

        <div class="progress-wrap">
            <div class="progress-bar" id="progress-bar" style="width:0%"></div>
        </div>
        <div class="progress-label" id="progress-label"></div>
    </div>

    <!-- Tâches du jour -->
    <div class="card">
        <div class="card-title">✅ Tâches de la journée</div>
        <div id="liste-taches"><div class="empty-state">Chargement…</div></div>
    </div>

    <!-- Historique 7 jours -->
    <div class="card">
        <div class="card-title">📈 Historique des 7 derniers jours</div>
        <div class="histo-grid" id="histo-grid"></div>
    </div>

    <!-- Événements validés aujourd'hui -->
    <div class="card">
        <div class="card-title">🕐 Validations d'aujourd'hui</div>
        <div id="evt-list" class="evt-list"><div class="empty-state">Aucune validation pour l'instant.</div></div>
    </div>

</main>

<script>
    const API = '/api/data';

    function fmtDate(str) {
      const [y, m, d] = str.split('-');
      const noms = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
      const mois = ['jan','fév','mar','avr','mai','juin','juil','aoû','sep','oct','nov','déc'];
      const date = new Date(y, m - 1, d);
      return noms[date.getDay()] + ' ' + d + ' ' + mois[m - 1];
    }

    function fmtHeure(iso) {
      // iso = "yyyy-MM-dd HH:mm:ss"
      return iso ? iso.slice(11, 16) : '';
    }

    async function charger() {
      let data;
      try {
        const r = await fetch(API);
        data = await r.json();
      } catch (e) {
        document.getElementById('liste-taches').innerHTML =
          '<div class="empty-state">⚠️ Impossible de contacter l\'application.<br>Vérifiez qu\'elle est bien lancée.</div>';
        return;
      }

      const auj     = data.aujourd_hui;
      const taches  = data.taches_du_jour  || [];
      const histo7  = data.historique_7j   || [];
      const evts    = auj.evenements        || [];

      // ── Résumé ────────────────────────────────────────────────────────────
      document.getElementById('date-label').textContent    = fmtDate(auj.date);
      document.getElementById('stat-validees').textContent = auj.validees;
      document.getElementById('stat-total').textContent    = auj.total;
      document.getElementById('stat-pct').textContent      = auj.pourcentage + '%';
      document.getElementById('progress-bar').style.width  = auj.pourcentage + '%';
      document.getElementById('progress-label').textContent =
        auj.validees + ' tâche' + (auj.validees > 1 ? 's' : '') + ' effectuée' +
        (auj.validees > 1 ? 's' : '') + ' sur ' + auj.total;

      // ── Tâches du jour ────────────────────────────────────────────────────
      const listEl = document.getElementById('liste-taches');
      if (!taches.length) {
        listEl.innerHTML = '<div class="empty-state">Aucune tâche configurée.</div>';
      } else {
        // Trouver si une tâche a été validée avec retard
        const valideesTardMap = {};
        evts.forEach(e => { if (e.enRetard) valideesTardMap[e.tache] = true; });

        listEl.innerHTML = taches.map(t => {
          const ok      = t.validee;
          const retard  = ok && valideesTardMap[t.nom];
          const badgeCls = ok ? 'badge-ok'   : 'badge-todo';
          const icon     = ok ? '✓'           : '·';
          let statutCls, statutTxt;
          if (!ok) {
            statutCls = 'statut-todo'; statutTxt = 'À faire';
          } else if (retard) {
            statutCls = 'statut-retard'; statutTxt = 'Fait (en retard)';
          } else {
            statutCls = 'statut-ok'; statutTxt = 'Fait ✓';
          }
          return `
            <div class="tache-item">
              <div class="tache-badge ${badgeCls}">${icon}</div>
              <div class="tache-info">
                <div class="tache-nom">${t.nom}</div>
                <div class="tache-plage">${t.plage}</div>
              </div>
              <span class="tache-statut ${statutCls}">${statutTxt}</span>
            </div>`;
        }).join('');
      }

      // ── Historique 7 jours ────────────────────────────────────────────────
      const maxVal = Math.max(...histo7.map(j => j.validees), 1);
      const histoEl = document.getElementById('histo-grid');
      histoEl.innerHTML = histo7.map(j => {
        const pct    = Math.round((j.validees / maxVal) * 100);
        const isToday = j.date === auj.date;
        return `
          <div class="histo-jour ${isToday ? 'today' : ''}">
            <div class="histo-count">${j.validees}</div>
            <div class="histo-bar-wrap">
              <div class="histo-bar" style="height:${pct}%"></div>
            </div>
            <div class="histo-date">${fmtDate(j.date).slice(0, 6)}</div>
            ${j.retards ? `<div class="histo-retard">${j.retards} retard${j.retards > 1 ? 's' : ''}</div>` : ''}
          </div>`;
      }).join('');

      // ── Événements du jour ────────────────────────────────────────────────
      const evtEl = document.getElementById('evt-list');
      if (!evts.length) {
        evtEl.innerHTML = '<div class="empty-state">Aucune validation enregistrée pour l\'instant.</div>';
      } else {
        evtEl.innerHTML = evts.map(e => `
          <div class="evt-item ${e.enRetard ? 'evt-tard' : 'evt-ok'}">
            <span class="evt-heure">${fmtHeure(e.horodatage)}</span>
            <span class="evt-nom">${e.tache}</span>
            <span class="evt-tag ${e.enRetard ? 'tag-tard' : 'tag-ok'}">
              ${e.enRetard ? 'En retard' : 'À l\'heure'}
            </span>
          </div>`).join('');
      }
    }

    charger();
    setInterval(charger, 10000); // rafraîchissement toutes les 10 secondes
</script>
</body>
</html>
